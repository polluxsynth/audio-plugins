name: Build DPF Plugin

on:
  push:
    branches:
      - dev
      - master
      - zynthian
#    tags:
#      - '*' # Trigger on any tag (for releases)
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch: # Allows manual triggering from the GitHub UI

env:
  # Plugin to build, matched against the DISTRHO_PLUGIN_NAME macro in
  # DistrhoPluginInfo.h for the plugin. VENDOR_NAME and both slugs are then
  # derived at build time (see "Extract plugin metadata" below).
  # Limitation: only a single name is supported for now.

  PLUGIN_NAME: MiMi-d

  # AU component type: 'aumu' = instrument.

  AU_TYPE: aumu

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            artifact_suffix: linux-x86_64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            artifact_suffix: linux-arm64
          - os: macos-15
            platform: macos
            arch: arm64
            artifact_suffix: macos-raw-arm64
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            artifact_suffix: macos-raw-x86_64
          - os: windows-latest
            platform: windows
            arch: x86_64
            artifact_suffix: windows-x86_64

    steps:
      # Checkout the repository and its submodules (DPF is usually a submodule)
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # Fetch all history for version tagging

      # Locate the DistrhoPluginInfo.h for $PLUGIN_NAME, then derive
      # VENDOR_NAME and both slugs from it, so only PLUGIN_NAME (above)
      # ever needs to be maintained by hand.
      - name: Extract plugin metadata
        id: meta
        shell: bash
        run: |
          # Find whichever DistrhoPluginInfo.h under plugins/*/ declares this
          # Slightly complex search method (more complex than a simple grep)
          # in order to avoid issues if PLUGIN_NAME contains characters which
          # would not be interpreted literally in a regexp.
          #   1st grep: isolate DISTRHO_PLUGIN_NAME definition lines (with
          #             filenames) across all headers.
          #   2nd grep: -F (fixed-string) literal match of "$PLUGIN_NAME" on
          #             those lines, so PLUGIN_NAME is never interpreted as
          #             regex even if it contains characters like . or +.
          #             Including both quote characters in the pattern also
          #             stops "MiMi-d" from matching a value like "MiMi-d2".
          # NOTE: -E (extended regex) is used throughout, with plain "+"
          #       rather than the GNU-only "\+", so this behaves the same
          #       under BSD grep/sed (macOS runners) and GNU grep/sed
          #       (Linux runners).
          HEADER=$(grep -Ern "^#define[[:space:]]+DISTRHO_PLUGIN_NAME" plugins --include=DistrhoPluginInfo.h \
            | grep -F "\"${PLUGIN_NAME}\"" | head -n1 | cut -d: -f1)

          if [ -z "$HEADER" ]; then
            echo "::error::No DistrhoPluginInfo.h under plugins/ declares DISTRHO_PLUGIN_NAME \"$PLUGIN_NAME\""
            exit 1
          fi
          echo "Using $HEADER"

          VENDOR_NAME=$(sed -nE 's/^#define[[:space:]]+DISTRHO_PLUGIN_BRAND[[:space:]]+"(.*)"/\1/p' "$HEADER")
          if [ -z "$VENDOR_NAME" ]; then
            echo "::error::Failed to extract DISTRHO_PLUGIN_BRAND from $HEADER"
            exit 1
          fi

          # AU identifiers, needed for the .aupreset files and by auval. DPF
          # calls them DISTRHO_PLUGIN_UNIQUE_ID (= AU subtype) and
          # DISTRHO_PLUGIN_BRAND_ID (= AU manufacturer): 4-character tokens
          # written without quotes. They must be exactly 4 characters (which
          # also catches e.g. a d_cconst('M','i','m','d') style definition),
          # but that is only enforced on macOS, the only place AU is built.
          AU_SUBTYPE=$(sed -nE 's/^#define[[:space:]]+DISTRHO_PLUGIN_UNIQUE_ID[[:space:]]+([^[:space:]/]+).*/\1/p' "$HEADER")
          AU_MANUFACTURER=$(sed -nE 's/^#define[[:space:]]+DISTRHO_PLUGIN_BRAND_ID[[:space:]]+([^[:space:]/]+).*/\1/p' "$HEADER")
          if [ "${{ matrix.platform }}" = "macos" ] && { [ "${#AU_SUBTYPE}" -ne 4 ] || [ "${#AU_MANUFACTURER}" -ne 4 ]; }; then
            echo "::error::AU subtype/manufacturer must be exactly 4 characters (DISTRHO_PLUGIN_UNIQUE_ID='$AU_SUBTYPE', DISTRHO_PLUGIN_BRAND_ID='$AU_MANUFACTURER') in $HEADER"
            exit 1
          fi

          # Slug = lowercase, alphanumeric only (e.g. "MiMi-d" -> "mimid")
          PLUGIN_SLUG=$(echo "$PLUGIN_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]//g')
          VENDOR_SLUG=$(echo "$VENDOR_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]//g')

          echo "VENDOR_NAME=$VENDOR_NAME"
          echo "PLUGIN_SLUG=$PLUGIN_SLUG"
          echo "VENDOR_SLUG=$VENDOR_SLUG"
          echo "AU_SUBTYPE=$AU_SUBTYPE"
          echo "AU_MANUFACTURER=$AU_MANUFACTURER"

          {
            echo "VENDOR_NAME=$VENDOR_NAME"
            echo "PLUGIN_SLUG=$PLUGIN_SLUG"
            echo "VENDOR_SLUG=$VENDOR_SLUG"
            echo "AU_SUBTYPE=$AU_SUBTYPE"
            echo "AU_MANUFACTURER=$AU_MANUFACTURER"
          } >> "$GITHUB_ENV"

      # Set up Python so we get a well-defined version
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # Determine version
      - name: Determine version
        id: version
        shell: bash
        run: |
          RAW_TAG=$(git describe --tags --always --long --match "[0-9]*.[0-9]*.[0-9]*" 2>/dev/null || echo "0.0.0-0-g0000000")
          if [[ "$RAW_TAG" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)-g([0-9a-f]+)$ ]]; then
            TAG="${BASH_REMATCH[1]}"
            DISTANCE="${BASH_REMATCH[2]}"
            SHA="${BASH_REMATCH[3]}"
            if [ "$DISTANCE" = "0" ]; then
              VERSION="$TAG"
            else
              VERSION="${TAG}-${SHA}"
            fi
          else
            # No matching tag found at all; fall back to the raw ref (e.g. short sha)
            VERSION=$(echo "$RAW_TAG" | sed -E 's/^v//')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      # Stash the metadata/version derived in "Extract plugin metadata" and
      # "Determine version" to a file so it can be bundled into the
      # merge-support artifact later ("Package merge-support artifact for
      # MacOS"), once README/manual are also ready. Only needs to happen
      # once, so it's pinned to a single, specific leg of the matrix.
      - name: Write build metadata (from MacOS build)
        if: matrix.os == 'macos-15'
        run: |
          mkdir -p meta
          {
            echo "VENDOR_NAME=$VENDOR_NAME"
            echo "PLUGIN_SLUG=$PLUGIN_SLUG"
            echo "VENDOR_SLUG=$VENDOR_SLUG"
            echo "AU_SUBTYPE=$AU_SUBTYPE"
            echo "AU_MANUFACTURER=$AU_MANUFACTURER"
            echo "VERSION=${{ steps.version.outputs.version }}"
          } > meta/build-metadata.env

      # Install dependencies for freetype and cairo
      - name: Install Linux GUI dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcairo2-dev libx11-dev libxext-dev libfreetype-dev

      - name: Install macOS GUI Dependencies
        if: matrix.platform == 'macos'
        run: |
          # Each macos leg of the matrix runs on its own native
          # architecture (arm64 on macos-15, x86_64 on macos-15-intel).
          # Homebrew stopped building new bottles for Intel macOS as of
          # Sept 2026 (Tier 3), (and also refuses to run on arm64 hardware
          # which is why we no longer build 'fat' binaries, as it is too
          # cumbersome to piece together; few machines are Intel these days
          # so the benefit is minimal) so this leg tends to build some of
          # these from source and take noticeably longer.
          brew install cairo freetype pkg-config dylibbundler

      # MinGW toolchain + GUI deps for Windows, mirroring what the Linux
      # leg gets from apt (see "Install Linux GUI dependencies" above).
      # MSVC was considered and rejected: DPF's Makefile-based Windows
      # support targets MinGW, MSVC support lives only in DPF's separate
      # CMake build files, which would mean maintaining a second,
      # hand-written build description for this plugin indefinitely.
      - name: Set up MSYS2/MinGW (Windows)
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-cairo
            mingw-w64-x86_64-freetype
            make

      # Build the plugin using the DPF Makefile Action
      - name: Build Plugin
        if: matrix.platform != 'windows'
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            export CC=clang
            export CXX=clang++

            # Each matrix macos leg runs natively on its own architecture
            # (arm64 on macos-15, x86_64 on macos-15-intel), so no lipo merge
            # attempting to build a fat binary.
            BREW_PREFIX=$(brew --prefix)
            mac_min="12.0"
            echo "=== Building macOS ${{ matrix.arch }} (prefix: $BREW_PREFIX, min OS: $mac_min) ==="
            export PKG_CONFIG_PATH="$BREW_PREFIX/opt/cairo/lib/pkgconfig:$BREW_PREFIX/opt/freetype/lib/pkgconfig"
            export MACOSX_DEPLOYMENT_TARGET="$mac_min"
            export CFLAGS="-mmacosx-version-min=$mac_min -I$BREW_PREFIX/include"
            export CXXFLAGS="-mmacosx-version-min=$mac_min -I$BREW_PREFIX/include"
            export LDFLAGS="-mmacosx-version-min=$mac_min -L$BREW_PREFIX/lib"
            # macOS gets VST3 and AU (AU is macOS-only, so Linux skips it).
            make TARGET=vst3
            make TARGET=au
            # Bundle non-system dylibs into each bundle and rewrite install
            # names. This is needed because otherwise it is required for the
            # user to have them installed separately on their machine. Each
            # bundle gets its own private copy under Contents/Frameworks, so
            # that VST3 and AU can be installed independently of each other.
            for BUNDLE in "$PLUGIN_NAME.vst3" "$PLUGIN_NAME.component"; do
              dylibbundler -od -b \
                -x "bin/$BUNDLE/Contents/MacOS/$PLUGIN_NAME" \
                -d "bin/$BUNDLE/Contents/Frameworks" \
                -p "@loader_path/../Frameworks/"
            done
          else
            make TARGET=lv2_sep
            make TARGET=vst3
          fi

      # Windows gets VST3 only for now (no LV2/AU equivalent shipped
      # there). Statically link the MinGW runtime (libgcc/libstdc++/
      # libwinpthread) directly into the plugin binary, since unlike
      # MSVC's vcruntime these are not preinstalled on end-user
      # machines and would otherwise need to be bundled as sidecar
      # DLLs next to the .vst3, the way dylibbundler does for macOS.
      - name: Build Plugin (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          make TARGET=vst3 \
            LDFLAGS="-static-libgcc -static-libstdc++ -static -lpthread"

      # Log contents of Mac binary using lipo and otool
      - name: Log contents of Mac binary
        if: matrix.platform == 'macos'
        run: |
          for BUNDLE in "$PLUGIN_NAME.vst3" "$PLUGIN_NAME.component"; do
            echo "=== $BUNDLE ==="
            lipo -info "bin/$BUNDLE/Contents/MacOS/$PLUGIN_NAME"
            otool -L "bin/$BUNDLE/Contents/MacOS/$PLUGIN_NAME"
          done

      # Add lv2 presets to Linux bundle
      - name: Add LV2 presets to Linux bundle
        if: matrix.platform == 'linux'
        run: |
          mkdir bin/$PLUGIN_NAME.presets.lv2
          # Fetch the presets, including the manifest
          cp -r plugins/$PLUGIN_SLUG/Presets/* bin/$PLUGIN_NAME.presets.lv2
          # Fetch the manual
          cp plugins/$PLUGIN_SLUG/Doc/$PLUGIN_SLUG-manual.pdf bin/

      # Create VST3 preset files
      #
      # The FUID's byte order differs on Windows (COM-style GUID field
      # swap) vs everywhere else, so the --platform argument must track
      # matrix.platform, not always be "linux". A preset built with the
      # wrong byte order embeds a class ID that won't match what the
      # plugin reports at runtime on that platform, so hosts won't
      # associate the preset with the plugin at all.
      - name: Create VST3 presets (all platforms)
        shell: bash
        run: |
          # Create VST3 presets
          cd plugins/$PLUGIN_SLUG
          # First determine Component FUID
          FUID_PLATFORM=linux
          if [ "${{ matrix.platform }}" = "windows" ]; then
            FUID_PLATFORM=windows
          fi
          fuid=$(python Utils/dpf_vst3_fuid.py \
            --oneline --platform "$FUID_PLATFORM" DistrhoPluginInfo.h $PLUGIN_NAME.cpp)
          echo "Using (Component) FUID $fuid"
          # Then read all .ttl preset files creating .vstpreset files
          sh Utils/ttl2preset.sh \
            --format vst3 \
            --name $PLUGIN_NAME \
            --vendor $VENDOR_NAME \
            --fuid $fuid \
            --category "Instrument" \
            Presets Vstpresets
          # Easier to access later:
          mv Vstpresets ../..
          # To clean up, remove Vstpresets

      # Create AU presets (macOS only, as AU is macOS-only).
      # Same driver script as in "Create VST3 presets (all platforms)",
      # run a second time with --format au so the .aupreset files end up in
      # their own directory (Aupresets), which maps one-to-one onto the AU
      # installer component, just like Vstpresets does for VST3.
      # AU subtype/manufacturer come from DistrhoPluginInfo.h (see "Extract
      # plugin metadata") rather than the script's built-in defaults, so they
      # can't go stale. AU type is set globally in this file.
      # vstpreset_writer.py and aupreset_writer.py must both sit next
      # to ttl2preset.sh in Utils/.
      - name: Create AU presets (MacOS only)
        if: matrix.platform == 'macos'
        run: |
          cd plugins/$PLUGIN_SLUG
          sh Utils/ttl2preset.sh \
            --format au \
            --au-type "$AU_TYPE" \
            --au-subtype "$AU_SUBTYPE" \
            --au-manufacturer "$AU_MANUFACTURER" \
            Presets Aupresets
          mv Aupresets ../..

      # Add VST3 presets to Linux bundle, next to the LV2 presets added
      # in "Add LV2 presets to Linux bundle", so they are also in the
      # uploaded artifact and not only inside the .deb/.rpm (which read
      # them from the repo root via nfpm). Same top-level Vstpresets/
      # folder as in the macOS raw artifacts.
      - name: Add VST3 presets to Linux bundle
        if: matrix.platform == 'linux'
        run: |
          cp -R Vstpresets bin/

      # Build the Windows installer with Inno Setup, which ships
      # preinstalled on windows-latest, so no separate tool install step
      # is needed (ISCC.exe is a plain CLI compiler, same shape as
      # calling pkgbuild/productbuild directly for the macOS .pkg).
      # Windows only gets one format here (VST3 -- there's no Windows
      # equivalent of AU to offer alongside it), so unlike the macOS
      # .pkg there's no distribution.xml-style choice tree needed.
      # {commoncf} is Inno Setup's "Common Files" constant, matching
      # Steinberg's fixed C:\Program Files\Common Files\VST3 location;
      # {commondocs} is the shared "Public\Documents" folder used for
      # the shared/all-users .vstpreset location per the VST3 spec.
      - name: Create Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          @"
          [Setup]
          AppName=$env:PLUGIN_NAME
          AppVersion=${{ steps.version.outputs.version }}
          AppPublisher=$env:VENDOR_NAME
          ArchitecturesInstallIn64BitMode=x64
          DefaultDirName={commoncf}\VST3
          DisableDirPage=yes
          DisableProgramGroupPage=yes
          PrivilegesRequired=admin
          OutputDir=bin
          OutputBaseFilename=$env:PLUGIN_NAME-${{ steps.version.outputs.version }}-windows-installer
          Compression=lzma
          SolidCompression=yes

          [Files]
          Source: "bin\$env:PLUGIN_NAME.vst3\*"; DestDir: "{app}\$env:PLUGIN_NAME.vst3"; Flags: recursesubdirs ignoreversion
          Source: "Vstpresets\*"; DestDir: "{commondocs}\VST3 Presets\$env:VENDOR_NAME\$env:PLUGIN_NAME"; Flags: recursesubdirs ignoreversion
          "@ | Set-Content -Path installer.iss -Encoding ASCII

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Build Artifacts for Windows
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_NAME }}-${{ matrix.artifact_suffix }}-${{ steps.version.outputs.version }}
          path: bin/

      # Upload the raw (single-arch, not packaged) .vst3 and .component
      # bundles together with the .vstpreset and .aupreset files, as one
      # per-architecture artifact. "Raw" as opposed to the universal
      # installer made by the merge job. It is kept as a build artifact
      # for inspecting the individual components, and it is also what
      # the merge-macos-universal job below downloads to lipo together
      # with the other architecture (so the name must match its
      # downloads).
      # It sits before the "Validate AU with auval (MacOS)" step, so the
      # bundles are still available if validation fails.
      # Everything is staged in one directory first, so that the bundles
      # end up at the top level of the artifact: upload-artifact roots
      # the artifact at the common parent of all uploaded paths, which
      # would otherwise put the bundles under bin/.
      - name: Stage raw bundles and presets for MacOS bundling
        if: matrix.platform == 'macos'
        run: |
          mkdir stage
          cp -R bin/. stage/
          cp -R Vstpresets Aupresets stage/

      - name: Upload raw plugin bundles and presets for MacOS
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_NAME }}-${{ matrix.artifact_suffix }}-${{ steps.version.outputs.version }}
          path: stage

      # Validate the AU with Apple's auval. Logic refuses AUs that fail
      # this, so it is the real acceptance test for the .component.
      # Runs on every macOS leg, i.e. natively on both arm64 and x86_64.
      # This is the only place the x86_64 slice is actually run (the
      # universal bundle is validated on arm64 only, in the merge job).
      # Subtype and manufacturer come from DistrhoPluginInfo.h (see
      # "Extract plugin metadata"), the type is AU_TYPE from the top of this
      # file. It runs after "Upload raw plugin bundles and presets for
      # MacOS", so the bundles are still available for inspection if this
      # fails.
      - name: Validate AU with auval (MacOS)
        if: matrix.platform == 'macos'
        run: |
          echo "Validating AU: type=$AU_TYPE subtype=$AU_SUBTYPE manufacturer=$AU_MANUFACTURER"

          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "bin/$PLUGIN_NAME.component" ~/Library/Audio/Plug-Ins/Components/
          # Make sure the registrar notices the new component.
          killall -9 AudioComponentRegistrar 2>/dev/null || true

          # For diagnostics: is it listed at all?
          auval -a || true
          auval -v "$AU_TYPE" "$AU_SUBTYPE" "$AU_MANUFACTURER"

      # Package everything the merge-macos-universal job needs, other
      # than the raw bundles and presets from "Upload raw plugin bundles
      # and presets for MacOS", into one artifact: the metadata file from
      # "Write build metadata (from MacOS build)", mimid-mac-install.txt
      # and the pdf manual.
      - name: Package merge-support artifact for MacOS
        if: matrix.os == 'macos-15'
        run: |
          mkdir -p merge-support
          cp meta/build-metadata.env merge-support/
          cp macos/mimid-mac-install.txt "merge-support/Installation README"
          cp plugins/$PLUGIN_SLUG/Doc/mimid-manual.pdf merge-support/$PLUGIN_NAME.pdf

      - name: Upload merge-support artifact for MacOS
        if: matrix.os == 'macos-15'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_NAME }}-merge-support
          path: merge-support

      # Build Linux .deb / .rpm installers
      - name: Create Linux installers
        if: matrix.platform == 'linux'
        run: |
          # Install nfpm (single static binary, no Ruby/Docker needed).
          # Pin a version and grab the prebuilt archive straight from GitHub
          # releases; nfpm doesn't ship a curl|sh installer, and the runner
          # has no Go toolchain for `go install`.
          NFPM_VERSION=2.47.0
          case "${{ matrix.arch }}" in
            x86_64) NFPM_ARCH=x86_64; DEB_ARCH=amd64;  RPM_ARCH=x86_64  ;;
            arm64)  NFPM_ARCH=arm64;  DEB_ARCH=arm64;  RPM_ARCH=aarch64 ;;
            *) echo "::error::Unknown arch ${{ matrix.arch }}"; exit 1 ;;
          esac
          curl -sfL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${NFPM_ARCH}.tar.gz" \
            | tar -xz -C /usr/local/bin nfpm
          chmod +x /usr/local/bin/nfpm
          nfpm --version

          cat > nfpm.yaml << EOF
          name: "$PLUGIN_SLUG"
          arch: "$DEB_ARCH"
          platform: "linux"
          version: "${{ steps.version.outputs.version }}"
          maintainer: "$VENDOR_NAME"
          vendor: "$VENDOR_NAME"
          description: "$PLUGIN_NAME audio plugin"
          contents:
            - src: bin/$PLUGIN_NAME.lv2
              dst: /usr/lib/lv2/$PLUGIN_NAME.lv2
            - src: bin/$PLUGIN_NAME.presets.lv2
              dst: /usr/lib/lv2/$PLUGIN_NAME.presets.lv2
            - src: bin/$PLUGIN_NAME.vst3
              dst: /usr/lib/vst3/$PLUGIN_NAME.vst3
            - src: Vstpresets
              dst: /usr/share/vst3/presets/$VENDOR_NAME/$PLUGIN_NAME
          # Runtime shared-library deps mirroring the -dev packages installed
          # for the build (libcairo2-dev, libx11-dev, libxext-dev,
          # libfreetype-dev), minus the -dev/headers. Package names differ
          # between deb and rpm ecosystems, so they're specified per format.
          overrides:
            deb:
              depends:
                - libcairo2
                - libx11-6
                - libxext6
                - libfreetype6
            rpm:
              depends:
                - cairo
                - libX11
                - libXext
                - freetype
          EOF

          nfpm package --config nfpm.yaml --target "bin/${PLUGIN_NAME}.deb" --packager deb

          # rpmbuild expects its own arch naming, so patch the config rather
          # than regenerate it from scratch.
          sed -i "s/^arch: .*/arch: \"$RPM_ARCH\"/" nfpm.yaml
          nfpm package --config nfpm.yaml --target "bin/${PLUGIN_NAME}.rpm" --packager rpm

      # Bundle the compiled binary assets (Linux; the macOS legs already
      # uploaded theirs in "Upload raw plugin bundles and presets for
      # MacOS", and uploading the same name twice would fail)
      - name: Upload Build Artifacts for Linux
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_NAME }}-${{ matrix.artifact_suffix }}-${{ steps.version.outputs.version }}
          path: bin/

  # Create fat bundle for MacOS. Although a large part of the world is
  # arm64 now, in some cases Cubase still runs under Rosetta, which means
  # that an x86_64 binary is required even on an arm64 host. To avoid users
  # having to keep track of what architecture is actually used, we create
  # a universal (fat) package.
  merge-macos-universal:
    name: Create universal (fat) MacOS bundle (arm64 + x86_64)
    needs: build
    runs-on: macos-15
    steps:
      # Download the metadata, installation readme and manual from the
      # earlier build stage. The bundles and presets come from the per-arch
      # raw artifacts, further down.
      - name: Download merge-support artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.PLUGIN_NAME }}-merge-support
          path: support

      - name: Load build metadata
        run: cat support/build-metadata.env >> "$GITHUB_ENV"

      # The per-arch "raw" artifacts (bundles + presets, no installer)
      # uploaded in the "Upload raw plugin bundles and presets for MacOS"
      # step of the build job (matrix artifact_suffix
      # macos-raw-arm64 / macos-raw-x86_64)
      - name: Download arm64 raw bundles for MacOS
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.PLUGIN_NAME }}-macos-raw-arm64-${{ env.VERSION }}
          path: raw-arm64

      - name: Download x86_64 raw bundles for MacOS
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.PLUGIN_NAME }}-macos-raw-x86_64-${{ env.VERSION }}
          path: raw-x86_64

      # Start from the arm64 bundle as the directory skeleton (Info.plist,
      # resources, etc. should be identical between archs), then overwrite
      # every Mach-O inside - the main binary plus any dylibs dylibbundler
      # embedded - with a lipo'd universal copy. Homebrew dylibs are
      # single-arch, matching whichever runner built them, so the
      # Frameworks folder needs merging too, not just the plugin binary.
      # Done for both the .vst3 and the .component (AU) bundle.
      - name: Merge into universal (fat) VST3 and AU
        run: |
          set -euo pipefail
          mkdir -p bin

          merge_bundle() {
            local bundle="$1"
            local arm="raw-arm64/$bundle"
            local x86="raw-x86_64/$bundle"
            local out="bin/$bundle"
            local mismatch=0
            local f rel

            cp -R "$arm" "$out"

            # Main plugin binary
            lipo -create \
              "$arm/Contents/MacOS/$PLUGIN_NAME" \
              "$x86/Contents/MacOS/$PLUGIN_NAME" \
              -output "$out/Contents/MacOS/$PLUGIN_NAME"

            # Any bundled Homebrew dylibs (cairo, freetype, etc.). Both arch
            # bundles should contain the same dylib names, just single-arch.
            # Process substitution (rather than a pipe) keeps the loop in
            # the current shell, so $mismatch survives it.
            if [ -d "$arm/Contents/Frameworks" ]; then
              while read -r f; do
                rel="${f#"$arm"/}"
                if [ -f "$x86/$rel" ]; then
                  lipo -create "$arm/$rel" "$x86/$rel" -output "$out/$rel"
                else
                  echo "::error::No x86_64 counterpart for $bundle/$rel, dylib sets differ between architectures"
                  mismatch=1
                fi
              done < <(find "$arm/Contents/Frameworks" -type f -name '*.dylib')
            fi
            return "$mismatch"
          }

          merge_bundle "$PLUGIN_NAME.vst3"
          merge_bundle "$PLUGIN_NAME.component"

      - name: Log contents of universal (fat) MacOS binaries
        run: |
          for BUNDLE in "$PLUGIN_NAME.vst3" "$PLUGIN_NAME.component"; do
            echo "=== $BUNDLE ==="
            lipo -info "bin/$BUNDLE/Contents/MacOS/$PLUGIN_NAME"
            otool -L "bin/$BUNDLE/Contents/MacOS/$PLUGIN_NAME"
          done

      # Validate the universal AU with auval, as the final check on exactly
      # what gets shipped. The runner is arm64, so this exercises the arm64
      # slice only; the x86_64 slice was run natively by auval on the Intel
      # build leg, before the merge. If this fails, the per-arch bundle
      # artifacts are of course still there, and so is the merge-support
      # artifact (the cleanup job only runs after a successful merge).
      - name: Validate universal AU with auval (MacOS)
        run: |
          echo "Validating AU: type=$AU_TYPE subtype=$AU_SUBTYPE manufacturer=$AU_MANUFACTURER"

          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "bin/$PLUGIN_NAME.component" ~/Library/Audio/Plug-Ins/Components/
          # Make sure the registrar notices the new component.
          killall -9 AudioComponentRegistrar 2>/dev/null || true

          # For diagnostics: is it listed at all?
          auval -a || true
          auval -v "$AU_TYPE" "$AU_SUBTYPE" "$AU_MANUFACTURER"

      # Build the MacOS installer. This is a "product archive": one
      # component package per plugin format (VST3, AU), wrapped by a
      # distribution.xml which shows the user a format checklist as a step
      # of the installer (customize="always"; the default, "allow", only
      # offers a Customize button that is easily clicked past). Both are
      # selected by default. Installing both at once is not always what
      # people want (hosts supporting both formats will list the plugin
      # twice), but neither is having to pick between separate downloads,
      # as plenty of people use e.g. both Logic (AU only) and Cubase (VST3
      # only). Each component carries its own format's presets, so
      # unticking a format also leaves out the presets that would be useless
      # without it. The presets are taken from the arm64 raw artifact; they
      # are identical in both raw artifacts, as they don't depend on the
      # architecture.
      - name: Create universal (fat) MacOS .pkg installer
        run: |
          PKG_ID="com.$VENDOR_SLUG.plugins.$PLUGIN_SLUG"
          mkdir pkgs

          # VST3 component: the bundle plus the .vstpreset files.
          PRESET_DIR="pkg_root_vst3/Library/Audio/Presets/$VENDOR_NAME/$PLUGIN_NAME"
          mkdir -p pkg_root_vst3/Library/Audio/Plug-Ins/VST3 "$PRESET_DIR"
          cp -R "bin/$PLUGIN_NAME.vst3" pkg_root_vst3/Library/Audio/Plug-Ins/VST3/
          cp -R raw-arm64/Vstpresets "$PRESET_DIR/"
          pkgbuild --root pkg_root_vst3 \
                   --install-location / \
                   --identifier "$PKG_ID.vst3" \
                   --version "$VERSION" \
                   pkgs/vst3.pkg

          # AU component: the bundle plus the .aupreset files
          AU_PRESET_DIR="pkg_root_au/Library/Audio/Presets/$VENDOR_NAME/$PLUGIN_NAME"
          mkdir -p pkg_root_au/Library/Audio/Plug-Ins/Components "$AU_PRESET_DIR"
          cp -R "bin/$PLUGIN_NAME.component" pkg_root_au/Library/Audio/Plug-Ins/Components/
          cp -R raw-arm64/Aupresets/. "$AU_PRESET_DIR/"
          pkgbuild --root pkg_root_au \
                   --install-location / \
                   --identifier "$PKG_ID.au" \
                   --version "$VERSION" \
                   pkgs/au.pkg

          cat > distribution.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="2">
            <title>$PLUGIN_NAME</title>
            <options customize="always"/>
            <choices-outline>
              <line choice="vst3"/>
              <line choice="au"/>
            </choices-outline>
            <choice id="vst3" title="VST3" start_selected="true"
                    description="VST3 plugin (Cubase, Bitwig, Reaper, Ableton Live, ...) including factory presets.">
              <pkg-ref id="$PKG_ID.vst3"/>
            </choice>
            <choice id="au" title="Audio Unit (AU)" start_selected="true"
                    description="Audio Unit plugin (Logic Pro, GarageBand, MainStage, ...) including factory presets.">
              <pkg-ref id="$PKG_ID.au"/>
            </choice>
            <pkg-ref id="$PKG_ID.vst3" version="$VERSION">vst3.pkg</pkg-ref>
            <pkg-ref id="$PKG_ID.au" version="$VERSION">au.pkg</pkg-ref>
          </installer-gui-script>
          EOF

          productbuild --distribution distribution.xml \
                       --package-path pkgs \
                       "bin/$PLUGIN_NAME-universal.pkg"

          rm -r "bin/$PLUGIN_NAME.vst3" "bin/$PLUGIN_NAME.component"
          cp "support/Installation README" "bin/Installation README"
          cp "support/$PLUGIN_NAME.pdf" "bin/$PLUGIN_NAME.pdf"

      - name: Upload universal build artifact for MacOS
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_NAME }}-macos-universal-${{ env.VERSION }}
          path: bin/

  # Remove the intermediate merge-support artifact consumed by
  # merge-macos-universal above. The per-arch bundle artifacts are kept
  # on purpose, for inspecting the individual bundles.
  cleanup-intermediate-artifacts:
    name: Delete intermediate merge artifacts (MacOS)
    # Only run if the merge stage succeeded, otherwise keeping the artifact
    # for debug
    needs: merge-macos-universal
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete merge-support artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="${PLUGIN_NAME}-merge-support"
          ID=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq ".artifacts[] | select(.name == \"$NAME\") | .id")
          if [ -n "$ID" ]; then
            echo "Deleting artifact $NAME (id $ID)"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$ID"
          else
            echo "::warning::Artifact $NAME not found for this run, skipping"
          fi
