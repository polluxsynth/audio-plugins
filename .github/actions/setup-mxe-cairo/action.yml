name: Build and publish MXE static Cairo/FreeType cross-toolchain
description: >-
  Builds an x86_64-w64-mingw32 MXE cross-toolchain (gcc/g++/pkg-config)
  plus a static Cairo, FreeType, Fontconfig and their dependency chain
  (libpng, zlib, libiconv, gettext/libintl, glib, pixman, ...), built
  with CAIRO_WIN32_STATIC_BUILD so Cairo's Windows headers don't emit
  __imp_-style dllimport references. This is what makes DPF's "Always
  build statically on windows" LINK_FLAGS += -static
  (Makefile.plugins.mk) link cleanly, unlike an ordinary dynamic Cairo
  package (e.g. MSYS2's mingw-w64-x86_64-cairo).

  Packages the result (mxe/usr) as a .tar.zst and publishes it as an
  asset on a GitHub Release. This is a slow, occasional build (~20-50
  minutes) meant to be run manually via the "Publish MXE toolchain"
  workflow, not on every push - build.yml's setup-mxe-cairo-download
  action downloads the published asset instead of rebuilding it.

inputs:
  mxe-ref:
    description: >-
      Git ref (commit SHA, tag, or branch) of https://github.com/mxe/mxe
      to build.
    required: false
    default: master
  release-tag:
    description: Tag of the GitHub Release to upload the tarball to.
    required: true
  github-token:
    description: Token with contents:write, for creating/uploading the release.
    required: true

outputs:
  mxe-sha:
    description: Resolved MXE commit SHA that was built.
    value: ${{ steps.rev.outputs.sha }}
  asset-name:
    description: File name of the uploaded tarball.
    value: ${{ steps.pack.outputs.asset_name }}
  sha256:
    description: SHA-256 of the uploaded tarball.
    value: ${{ steps.pack.outputs.sha256 }}

runs:
  using: composite
  steps:
    # MXE's own build dependencies (compiling MXE's cross-gcc and its
    # package set from source), per MXE's published Debian/Ubuntu
    # requirements (https://mxe.cc/#requirements-debian). This list can
    # drift as Ubuntu package names change between runner image versions
    # - if this step or the MXE build itself fails on a missing tool,
    # that's the first place to look.
    - name: Install MXE build requirements
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -yq --no-install-recommends \
          autoconf automake autopoint bash bison bzip2 flex gettext \
          git g++ gperf intltool libffi-dev libgdk-pixbuf2.0-dev \
          libtool libtool-bin libltdl-dev libssl-dev libxml-parser-perl lzip make \
          openssl p7zip-full patch perl pkg-config python3 python3-mako \
          python3-packaging ruby sed unzip wget xz-utils zstd

    - name: Resolve MXE commit
      id: rev
      shell: bash
      run: |
        SHA=$(git ls-remote https://github.com/mxe/mxe.git "${{ inputs.mxe-ref }}" | cut -f1)
        if [ -z "$SHA" ]; then
          # Not a branch/tag ref - assume mxe-ref is already a commit SHA.
          SHA="${{ inputs.mxe-ref }}"
        fi
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        echo "Building MXE @ $SHA"

    - name: Clone MXE
      shell: bash
      run: |
        git clone https://github.com/mxe/mxe.git "${{ github.workspace }}/mxe"
        cd "${{ github.workspace }}/mxe"
        git checkout "${{ steps.rev.outputs.sha }}"

    # The slow step: building MXE's own GCC cross-toolchain plus Cairo's
    # full static dependency chain from source. Expect this to take
    # roughly 20-50 minutes (observed up to ~47 minutes in practice).
    - name: Build static Cairo (and its full dependency chain, incl. gcc)
      shell: bash
      run: |
        cd "${{ github.workspace }}/mxe"
        # 80 minutes: comfortable margin over the ~47 minute worst case
        # observed in practice, without masking a hang for hours on the
        # default job-level timeout.
        timeout 80m make MXE_TARGETS=x86_64-w64-mingw32.static JOBS=$(nproc) cairo

    # Only usr/ is needed to use the toolchain - pkg/, tmp-*, .git etc.
    # are MXE's own build scratch space and aren't part of the result.
    - name: Package toolchain
      id: pack
      shell: bash
      run: |
        cd "${{ github.workspace }}/mxe"
        NAME="mxe-x86_64-w64-mingw32-static-cairo-${{ steps.rev.outputs.sha }}.tar.zst"
        tar -C usr -cf - . | zstd -T0 -19 -o "$GITHUB_WORKSPACE/$NAME"
        cd "$GITHUB_WORKSPACE"
        SHA256=$(sha256sum "$NAME" | cut -d' ' -f1)
        du -h "$NAME"
        echo "asset_name=$NAME" >> "$GITHUB_OUTPUT"
        echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
        echo "$SHA256  $NAME" > "$NAME.sha256"

    - name: Publish to GitHub Release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        cd "$GITHUB_WORKSPACE"
        ASSET="${{ steps.pack.outputs.asset_name }}"
        if gh release view "${{ inputs.release-tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
          gh release upload "${{ inputs.release-tag }}" "$ASSET" "$ASSET.sha256" \
            --repo "${{ github.repository }}" --clobber
        else
          gh release create "${{ inputs.release-tag }}" "$ASSET" "$ASSET.sha256" \
            --repo "${{ github.repository }}" \
            --title "MXE static Cairo toolchain (${{ steps.rev.outputs.sha }})" \
            --notes "Prebuilt x86_64-w64-mingw32 static Cairo/FreeType/Fontconfig toolchain, built from mxe/mxe@${{ steps.rev.outputs.sha }}. SHA-256: ${{ steps.pack.outputs.sha256 }}"
        fi
